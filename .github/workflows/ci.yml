name: Site content checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check chapters, navigation and assets
        run: python3 scripts/check_site.py
