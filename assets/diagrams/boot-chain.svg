<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc"><title id="title">Linux 启动阶段与控制权交接</title><desc id="desc">固件完成平台初始化后调用启动管理器或引导加载器；引导器加载内核与可选 initramfs；内核运行早期 init；initramfs 中的 init 可准备真实根文件系统并执行 PID 1。</desc><g font-family="sans-serif"><g><rect x="16" y="26" width="140" height="68" rx="9" fill="#edf1f4" stroke="#53676d" stroke-width="2"/><text x="86" y="55" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">固件</text><text x="86" y="76" text-anchor="middle" font-size="12" fill="#53676d">BIOS / UEFI</text><path d="M157 60H184m-10-8 10 8-10 8" stroke="#147f80" stroke-width="3" fill="none"/><rect x="188" y="26" width="140" height="68" rx="9" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="258" y="55" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">Bootloader</text><text x="258" y="76" text-anchor="middle" font-size="12" fill="#53676d">选择并装载</text><path d="M329 60H356m-10-8 10 8-10 8" stroke="#147f80" stroke-width="3" fill="none"/><rect x="360" y="26" width="140" height="68" rx="9" fill="#f2eefa" stroke="#7461ba" stroke-width="2"/><text x="430" y="55" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">Linux 内核</text><text x="430" y="76" text-anchor="middle" font-size="12" fill="#53676d">早期初始化</text><path d="M501 60H528m-10-8 10 8-10 8" stroke="#147f80" stroke-width="3" fill="none"/><rect x="532" y="26" width="140" height="68" rx="9" fill="#fff4ed" stroke="#d06d4d" stroke-width="2"/><text x="602" y="55" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">initramfs</text><text x="602" y="76" text-anchor="middle" font-size="12" fill="#53676d">可选早期用户态</text><path d="M673 60H700m-10-8 10 8-10 8" stroke="#147f80" stroke-width="3" fill="none"/><rect x="704" y="26" width="80" height="68" rx="9" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="744" y="55" text-anchor="middle" font-size="15" font-weight="700" fill="#203035">PID 1</text><text x="744" y="76" text-anchor="middle" font-size="11" fill="#53676d">init</text></g><path d="M602 96V149H430V171" fill="none" stroke="#d06d4d" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="242" y="174" width="376" height="68" rx="10" fill="#fffdf9" stroke="#dce5e1" stroke-width="2"/><text x="430" y="201" text-anchor="middle" font-size="16" font-weight="700" fill="#203035">真实根文件系统准备</text><text x="430" y="224" text-anchor="middle" font-size="13" fill="#53676d">发现设备 · 加载模块 · 解锁/组装存储 · mount · switch_root</text><path d="M619 208H690V94" fill="none" stroke="#147f80" stroke-width="2.5"/><path d="m682 105 8-11 8 11" fill="none" stroke="#147f80" stroke-width="2.5"/><text x="400" y="278" text-anchor="middle" font-size="13" fill="#53676d">不同固件、架构和发行版的具体路径会有所不同</text></g></svg>