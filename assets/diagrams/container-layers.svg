<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 302" role="img" aria-labelledby="t d"><title id="t">容器共享宿主机内核的层次关系</title><desc id="d">容器A与B各有隔离的进程环境，Namespace提供视图隔离，cgroup提供资源控制；二者共享同一Linux内核与硬件。概念示意。</desc><g font-family="sans-serif"><rect x="12" y="10" width="776" height="282" rx="14" fill="#fffdf9" stroke="#dce5e1" stroke-width="2"/><rect x="36" y="28" width="352" height="91" rx="11" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><rect x="412" y="28" width="352" height="91" rx="11" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="212" y="61" text-anchor="middle" font-size="19" font-weight="700" fill="#0d6667">容器 A · 进程组</text><text x="212" y="92" text-anchor="middle" font-size="15" fill="#53676d">独立的 Namespace 视图</text><text x="588" y="61" text-anchor="middle" font-size="19" font-weight="700" fill="#0d6667">容器 B · 进程组</text><text x="588" y="92" text-anchor="middle" font-size="15" fill="#53676d">独立的 Namespace 视图</text><rect x="36" y="137" width="728" height="48" rx="9" fill="#fff4ed" stroke="#d06d4d" stroke-width="2"/><text x="400" y="167" text-anchor="middle" font-size="17" fill="#203035">cgroup · 为进程组配置资源控制</text><rect x="36" y="204" width="728" height="43" rx="9" fill="#f2eefa" stroke="#7461ba" stroke-width="2"/><text x="400" y="232" text-anchor="middle" font-size="17" fill="#203035">共享的 Linux 内核</text><rect x="36" y="255" width="728" height="27" rx="8" fill="#e8edf1"/><text x="400" y="275" text-anchor="middle" font-size="15" fill="#203035">宿主机硬件</text><path d="M212 120V135M588 120V135M400 186V203" stroke="#53676d" stroke-width="2.5" fill="none"/></g></svg>