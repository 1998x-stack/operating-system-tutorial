<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d">
<title id="t">eBPF 程序从加载到挂载的数据通道</title>
<desc id="d">用户态 C 源码经 clang 编译为 BPF ELF 字节码，通过 bpf() 系统调用提交给内核。内核验证器对字节码做静态分析，检查越界访问、空指针解引用与有界循环等；未通过则返回错误。通过后 JIT 编译器把字节码翻译成本机指令，程序挂载到 kprobe、tracepoint、XDP 等事件上。事件触发时程序执行，只能通过 BPF Map 与用户态交换数据，用户态再周期读取做汇总。验证器与 Map 是能力边界所在：既不是任意内核代码注入，也不能直接写日志。</desc>
<g font-family="sans-serif">
<text x="400" y="26" text-anchor="middle" font-size="17" fill="#203035">eBPF 加载与 Map 数据通道</text>
<rect x="40" y="46" width="200" height="58" rx="8" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/>
<text x="140" y="68" text-anchor="middle" font-size="13" fill="#203035">用户态 C 源码</text>
<text x="140" y="86" text-anchor="middle" font-size="11" fill="#53676d">clang -target bpf -c</text>
<text x="140" y="99" text-anchor="middle" font-size="11" fill="#53676d">→ BPF ELF 字节码</text>
<rect x="300" y="46" width="200" height="58" rx="8" fill="#f2eefa" stroke="#7461ba" stroke-width="2"/>
<text x="400" y="68" text-anchor="middle" font-size="13" fill="#203035">bpf() 系统调用</text>
<text x="400" y="86" text-anchor="middle" font-size="11" fill="#53676d">BPF_PROG_LOAD</text>
<text x="400" y="99" text-anchor="middle" font-size="11" fill="#53676d">提交字节码</text>
<rect x="560" y="46" width="200" height="58" rx="8" fill="#fbe9e1" stroke="#d06d4d" stroke-width="2"/>
<text x="660" y="66" text-anchor="middle" font-size="13" fill="#203035">验证器</text>
<text x="660" y="83" text-anchor="middle" font-size="11" fill="#53676d">静态分析所有路径</text>
<text x="660" y="97" text-anchor="middle" font-size="11" fill="#53676d">拒绝越界/死循环</text>
<path d="M240 75 L300 75 M500 75 L560 75" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M660 104 L660 150 L200 150 L200 176" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="430" y="142" text-anchor="middle" font-size="11" fill="#53676d">验证通过 → JIT 编译为本机指令 → 挂载事件</text>
<rect x="40" y="176" width="320" height="52" rx="8" fill="#f6efdc" stroke="#916c22" stroke-width="2"/>
<text x="200" y="197" text-anchor="middle" font-size="13" fill="#203035">挂载点：kprobe / tracepoint</text>
<text x="200" y="215" text-anchor="middle" font-size="11" fill="#53676d">XDP / TC / raw_tp / sched_ext</text>
<rect x="440" y="176" width="320" height="52" rx="8" fill="#f6efdc" stroke="#916c22" stroke-width="2"/>
<text x="600" y="197" text-anchor="middle" font-size="13" fill="#203035">事件触发时执行 BPF 程序</text>
<text x="600" y="215" text-anchor="middle" font-size="11" fill="#53676d">不能直接写日志或任意调内核函数</text>
<path d="M360 202 L440 202" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="200" y="264" width="400" height="52" rx="8" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/>
<text x="400" y="285" text-anchor="middle" font-size="13" fill="#203035">BPF Map：内核态与用户态的唯一数据通道</text>
<text x="400" y="303" text-anchor="middle" font-size="11" fill="#53676d">hash / array / ringbuf / perf event array</text>
<path d="M600 228 L600 246 L400 246 L400 264" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M200 316 L200 340 L660 340 L660 320" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="430" y="358" text-anchor="middle" font-size="11" fill="#53676d">用户态周期读取 Map 做汇总（bpftool / libbpf / bpftrace）</text>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#53676d"/></marker></defs>
</g></svg>
