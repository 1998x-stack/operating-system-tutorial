<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d"><title id="t">fork 后写时复制：父子进程先共享只读物理页，写入时子进程获得私有副本</title><desc id="d">父进程页表与子进程页表起初指向同一物理页并标记为只读；子进程写入时触发缺页异常，内核分配一个新的可写物理页并复制内容，再修改对应的页表项。这是简化概念图，未画出多级页表、TLB 与内核栈。</desc><g font-family="sans-serif"><rect x="24" y="40" width="176" height="80" rx="9" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="112" y="74" text-anchor="middle" font-size="17" fill="#203035">父进程页表</text><text x="112" y="98" text-anchor="middle" font-size="13" fill="#53676d">PTE 只读</text><rect x="24" y="190" width="176" height="80" rx="9" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="112" y="224" text-anchor="middle" font-size="17" fill="#203035">子进程页表</text><text x="112" y="248" text-anchor="middle" font-size="13" fill="#53676d">PTE 只读</text><rect x="300" y="105" width="200" height="80" rx="9" fill="#f2eefa" stroke="#7461ba" stroke-width="2"/><text x="400" y="139" text-anchor="middle" font-size="17" fill="#203035">同一物理页</text><text x="400" y="163" text-anchor="middle" font-size="13" fill="#53676d">只读共享</text><rect x="590" y="195" width="190" height="80" rx="9" fill="#fff4ed" stroke="#d06d4d" stroke-width="2"/><text x="685" y="229" text-anchor="middle" font-size="17" fill="#203035">新物理页</text><text x="685" y="253" text-anchor="middle" font-size="13" fill="#53676d">私有 · 可写</text><g stroke="#147f80" stroke-width="3" fill="none"><path d="M200 80H260V130H295"/><path d="m285 122 11 8-11 8"/><path d="M200 230H260V160H295"/><path d="m285 152 11 8-11 8"/></g><text x="248" y="72" font-size="13" fill="#53676d">共享映射</text><path d="M500 155H560V225H585" stroke="#d06d4d" stroke-width="3" fill="none" stroke-dasharray="7 5"/><path d="m575 217 11 8-11 8" stroke="#d06d4d" fill="none" stroke-width="3"/><text x="560" y="150" font-size="13" fill="#53676d">写入时</text><text x="560" y="172" font-size="13" fill="#d06d4d">触发缺页并复制</text></g></svg>
