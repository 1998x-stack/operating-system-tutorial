<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="title desc"><title id="title">宏内核、微内核和混合内核的服务边界</title><desc id="desc">宏内核把文件系统网络和驱动放在内核域；微内核将最小机制放在内核并把服务放在用户域；混合内核根据具体系统将多个服务组件放在内核域。</desc><g font-family="sans-serif"><rect x="12" y="12" width="246" height="306" rx="12" fill="#fffdf9" stroke="#dce5e1" stroke-width="2"/><text x="135" y="39" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">宏内核</text><rect x="28" y="54" width="214" height="225" rx="9" fill="#f2eefa" stroke="#7461ba" stroke-width="2"/><text x="135" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#7461ba">内核保护域</text><g fill="#fff" stroke="#7461ba"><rect x="45" y="92" width="180" height="37" rx="6"/><rect x="45" y="139" width="180" height="37" rx="6"/><rect x="45" y="186" width="180" height="37" rx="6"/><rect x="45" y="233" width="180" height="30" rx="6"/></g><g fill="#203035" font-size="14" text-anchor="middle"><text x="135" y="116">文件系统</text><text x="135" y="163">网络栈</text><text x="135" y="210">设备驱动</text><text x="135" y="253">调度 / 内存</text></g><rect x="278" y="12" width="246" height="306" rx="12" fill="#fffdf9" stroke="#dce5e1" stroke-width="2"/><text x="401" y="39" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">微内核</text><rect x="294" y="54" width="214" height="75" rx="9" fill="#f2eefa" stroke="#7461ba" stroke-width="2"/><text x="401" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#7461ba">最小内核</text><text x="401" y="105" text-anchor="middle" font-size="13" fill="#203035">IPC · 调度 · 地址空间</text><path d="M401 129V153m-8-9 8 10 8-10" fill="none" stroke="#147f80" stroke-width="2.5"/><rect x="294" y="158" width="214" height="121" rx="9" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="401" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#0d6667">用户态服务</text><g fill="#fff" stroke="#147f80"><rect x="309" y="194" width="184" height="25" rx="5"/><rect x="309" y="225" width="184" height="25" rx="5"/><rect x="309" y="256" width="184" height="17" rx="5"/></g><g fill="#203035" font-size="13" text-anchor="middle"><text x="401" y="212">文件系统服务</text><text x="401" y="243">网络服务 / 驱动</text><text x="401" y="269">IPC 请求</text></g><rect x="540" y="12" width="248" height="306" rx="12" fill="#fffdf9" stroke="#dce5e1" stroke-width="2"/><text x="664" y="39" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">混合内核</text><rect x="556" y="54" width="216" height="225" rx="9" fill="#f2eefa" stroke="#7461ba" stroke-width="2"/><text x="664" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#7461ba">内核保护域</text><g fill="#fff" stroke="#7461ba"><rect x="573" y="92" width="182" height="37" rx="6"/><rect x="573" y="139" width="182" height="37" rx="6"/><rect x="573" y="186" width="182" height="37" rx="6"/></g><g fill="#203035" font-size="14" text-anchor="middle"><text x="664" y="116">核心内核</text><text x="664" y="163">执行体 / BSD 服务</text><text x="664" y="210">多数驱动</text></g><rect x="573" y="235" width="182" height="28" rx="6" fill="#e7f4f0" stroke="#147f80"/><text x="664" y="254" text-anchor="middle" font-size="13" fill="#203035">部分用户态服务</text><text x="400" y="311" text-anchor="middle" font-size="11" fill="#53676d">概念图：具体操作系统的服务位置与边界各不相同</text></g></svg>