<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc"><title id="title">统一内存与分离的一级指令数据缓存</title><desc id="desc">处理器内部的指令取值路径经过 L1 指令缓存，数据访问路径经过 L1 数据缓存；两者连接到更低层的统一缓存和 DRAM。</desc><g font-family="sans-serif"><rect x="280" y="14" width="240" height="48" rx="9" fill="#f2eefa" stroke="#7461ba" stroke-width="2"/><text x="400" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">CPU 核心</text><path d="M335 62V91H205V112M465 62V91H595V112" fill="none" stroke="#147f80" stroke-width="3"/><path d="m196 102 9 11 9-11m372 0 9 11 9-11" fill="none" stroke="#147f80" stroke-width="3"/><rect x="95" y="115" width="220" height="54" rx="9" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="205" y="138" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">L1 I-cache</text><text x="205" y="157" text-anchor="middle" font-size="13" fill="#53676d">指令取值</text><rect x="485" y="115" width="220" height="54" rx="9" fill="#fff4ed" stroke="#d06d4d" stroke-width="2"/><text x="595" y="138" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">L1 D-cache</text><text x="595" y="157" text-anchor="middle" font-size="13" fill="#53676d">数据读写</text><path d="M205 169V195H400V215M595 169V195H400" fill="none" stroke="#7461ba" stroke-width="3"/><path d="m391 205 9 11 9-11" fill="none" stroke="#7461ba" stroke-width="3"/><rect x="285" y="218" width="230" height="45" rx="9" fill="#edf1f4" stroke="#53676d" stroke-width="2"/><text x="400" y="246" text-anchor="middle" font-size="17" fill="#203035">更低层缓存 / DRAM</text><text x="400" y="287" text-anchor="middle" font-size="12" fill="#53676d">逻辑地址空间可统一；缓存层次和一致性规则由具体微架构与 ISA 决定</text></g></svg>