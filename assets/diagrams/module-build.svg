<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc"><title id="title">外部 Linux 内核模块的构建与加载</title><desc id="desc">hello.c 和 Kbuild Makefile 交给匹配的内核构建目录，产生 hello.ko；加载时内核检查符号、版本与可选签名，再运行模块初始化函数。</desc><g font-family="sans-serif"><rect x="18" y="34" width="170" height="72" rx="10" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="103" y="63" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">hello.c</text><text x="103" y="87" text-anchor="middle" font-size="13" fill="#53676d">模块源码</text><rect x="18" y="146" width="170" height="72" rx="10" fill="#edf1f4" stroke="#53676d" stroke-width="2"/><text x="103" y="175" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">Makefile</text><text x="103" y="199" text-anchor="middle" font-size="13" fill="#53676d">obj-m / Kbuild</text><path d="M189 70H246V126H278M189 182H246V126" fill="none" stroke="#147f80" stroke-width="2.5"/><path d="m267 118 11 8-11 8" fill="none" stroke="#147f80" stroke-width="2.5"/><rect x="282" y="88" width="204" height="76" rx="10" fill="#f2eefa" stroke="#7461ba" stroke-width="2"/><text x="384" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">匹配的内核构建树</text><text x="384" y="142" text-anchor="middle" font-size="13" fill="#53676d">headers · symbols · config</text><path d="M487 126H532m-11-8 11 8-11 8" fill="none" stroke="#d06d4d" stroke-width="3"/><rect x="536" y="88" width="100" height="76" rx="10" fill="#fff4ed" stroke="#d06d4d" stroke-width="2"/><text x="586" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">hello.ko</text><text x="586" y="142" text-anchor="middle" font-size="13" fill="#53676d">模块对象</text><path d="M637 126H676m-11-8 11 8-11 8" fill="none" stroke="#d06d4d" stroke-width="3"/><rect x="680" y="88" width="104" height="76" rx="10" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="732" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#203035">内核加载器</text><text x="732" y="139" text-anchor="middle" font-size="12" fill="#53676d">检查 / init</text><text x="400" y="245" text-anchor="middle" font-size="13" fill="#53676d">版本匹配、导出符号和模块签名策略都可能影响加载结果</text></g></svg>