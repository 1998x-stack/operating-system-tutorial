<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-labelledby="title desc"><title id="title">操作系统在应用与硬件之间建立抽象和保护</title><desc id="desc">应用通过系统调用访问内核服务，内核服务使用驱动和硬件接口控制 CPU、内存和设备；固件负责更早的启动阶段。</desc><g font-family="sans-serif"><rect x="16" y="16" width="768" height="54" rx="10" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="400" y="49" text-anchor="middle" font-size="21" font-weight="700" fill="#203035">应用程序 · 用户态</text><path d="M400 70V91m-9-9 9 10 9-10" fill="none" stroke="#147f80" stroke-width="3"/><text x="420" y="85" font-size="13" fill="#53676d">系统调用 / ABI</text><rect x="16" y="97" width="768" height="65" rx="10" fill="#f2eefa" stroke="#7461ba" stroke-width="2"/><text x="400" y="124" text-anchor="middle" font-size="21" font-weight="700" fill="#203035">内核服务 · 内核态</text><text x="400" y="148" text-anchor="middle" font-size="14" fill="#53676d">进程调度 · 虚拟内存 · VFS · 网络栈 · IPC</text><path d="M400 162V183m-9-9 9 10 9-10" fill="none" stroke="#d06d4d" stroke-width="3"/><text x="420" y="178" font-size="13" fill="#53676d">驱动 / 硬件接口</text><rect x="16" y="190" width="768" height="46" rx="10" fill="#fff4ed" stroke="#d06d4d" stroke-width="2"/><text x="400" y="219" text-anchor="middle" font-size="19" font-weight="700" fill="#203035">CPU · DRAM · 存储 · 网络设备</text><text x="400" y="258" text-anchor="middle" font-size="12" fill="#53676d">固件与 Bootloader 在内核启动前建立执行环境（不属于这条日常系统调用路径）</text></g></svg>