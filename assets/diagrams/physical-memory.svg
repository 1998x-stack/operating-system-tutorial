<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="t d"><title id="t">Linux 物理内存分配与回收层次</title><desc id="d">Buddy allocator 分配连续 order 页块，SLUB 从 slab 缓存分配小对象；内存压力下 kswapd 与 direct reclaim 选择可回收 folio，MGLRU 提供一种回收策略，memory cgroup 约束工作负载。</desc><g font-family="sans-serif" text-anchor="middle"><rect x="25" y="35" width="245" height="82" rx="12" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="147" y="67" font-size="20" font-weight="700" fill="#203035">Buddy allocator</text><text x="147" y="93" font-size="14" fill="#53676d">order × PAGE_SIZE</text><rect x="325" y="35" width="245" height="82" rx="12" fill="#f5f1fd" stroke="#7461ba" stroke-width="2"/><text x="447" y="67" font-size="20" font-weight="700" fill="#203035">SLUB</text><text x="447" y="93" font-size="14" fill="#53676d">small kernel objects</text><rect x="625" y="35" width="245" height="82" rx="12" fill="#fff4ed" stroke="#d06d4d" stroke-width="2"/><text x="747" y="67" font-size="20" font-weight="700" fill="#203035">Memory cgroup</text><text x="747" y="93" font-size="14" fill="#53676d">low / high / max</text><path d="M270 76 H325 M570 76 H625" stroke="#147f80" stroke-width="3"/><path d="M147 117 V155 H320 M447 117 V155 H320" stroke="#147f80" stroke-width="2.5" fill="none"/><rect x="320" y="155" width="260" height="76" rx="12" fill="#edf6f7" stroke="#147f80" stroke-width="2"/><text x="450" y="185" font-size="20" font-weight="700" fill="#203035">Reclaim</text><text x="450" y="210" font-size="14" fill="#53676d">kswapd / direct reclaim / MGLRU</text><path d="M747 117 V155 H580" stroke="#d06d4d" stroke-width="2.5" fill="none"/><text x="450" y="263" font-size="12" fill="#53676d">页级分配、对象级分配、回收策略与 cgroup 记账是相关但不同的层次</text></g></svg>