<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc"><title id="title">三种处理器架构中的用户态与内核态</title><desc id="desc">x86-64 使用 Ring 3 和 Ring 0，AArch64 常用 EL0 和 EL1，RISC-V 常用 U-mode 和 S-mode。系统调用或环境调用触发受控陷入。</desc><g font-family="sans-serif"><g><rect x="18" y="18" width="238" height="222" rx="12" fill="#fffdf9" stroke="#dce5e1" stroke-width="2"/><text x="137" y="48" text-anchor="middle" font-size="19" font-weight="700" fill="#203035">x86-64</text><rect x="38" y="66" width="198" height="60" rx="8" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="137" y="92" text-anchor="middle" font-size="18" fill="#203035">Ring 3</text><text x="137" y="113" text-anchor="middle" font-size="13" fill="#53676d">用户程序</text><path d="M137 126V151m-8-9 8 10 8-10" fill="none" stroke="#d06d4d" stroke-width="3"/><text x="151" y="143" font-size="12" fill="#53676d">syscall</text><rect x="38" y="158" width="198" height="60" rx="8" fill="#f2eefa" stroke="#7461ba" stroke-width="2"/><text x="137" y="184" text-anchor="middle" font-size="18" fill="#203035">Ring 0</text><text x="137" y="205" text-anchor="middle" font-size="13" fill="#53676d">内核</text></g><g><rect x="281" y="18" width="238" height="222" rx="12" fill="#fffdf9" stroke="#dce5e1" stroke-width="2"/><text x="400" y="48" text-anchor="middle" font-size="19" font-weight="700" fill="#203035">AArch64</text><rect x="301" y="66" width="198" height="60" rx="8" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="400" y="92" text-anchor="middle" font-size="18" fill="#203035">EL0</text><text x="400" y="113" text-anchor="middle" font-size="13" fill="#53676d">应用</text><path d="M400 126V151m-8-9 8 10 8-10" fill="none" stroke="#d06d4d" stroke-width="3"/><text x="414" y="143" font-size="12" fill="#53676d">svc</text><rect x="301" y="158" width="198" height="60" rx="8" fill="#f2eefa" stroke="#7461ba" stroke-width="2"/><text x="400" y="184" text-anchor="middle" font-size="18" fill="#203035">EL1</text><text x="400" y="205" text-anchor="middle" font-size="13" fill="#53676d">OS 内核</text></g><g><rect x="544" y="18" width="238" height="222" rx="12" fill="#fffdf9" stroke="#dce5e1" stroke-width="2"/><text x="663" y="48" text-anchor="middle" font-size="19" font-weight="700" fill="#203035">RISC-V</text><rect x="564" y="66" width="198" height="60" rx="8" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="663" y="92" text-anchor="middle" font-size="18" fill="#203035">U-mode</text><text x="663" y="113" text-anchor="middle" font-size="13" fill="#53676d">应用</text><path d="M663 126V151m-8-9 8 10 8-10" fill="none" stroke="#d06d4d" stroke-width="3"/><text x="677" y="143" font-size="12" fill="#53676d">ecall</text><rect x="564" y="158" width="198" height="60" rx="8" fill="#f2eefa" stroke="#7461ba" stroke-width="2"/><text x="663" y="184" text-anchor="middle" font-size="18" fill="#203035">S-mode</text><text x="663" y="205" text-anchor="middle" font-size="13" fill="#53676d">OS 内核</text></g><text x="400" y="273" text-anchor="middle" font-size="14" fill="#53676d">更高特权级入口由处理器架构定义；并非所有平台都实现所有可选级别</text></g></svg>