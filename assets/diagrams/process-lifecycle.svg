<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="t d"><title id="t">进程生命周期与 fork、exec、wait</title><desc id="d">父进程调用 fork 创建子进程，私有可写页在写入时复制；子进程 exec 替换程序映像，退出后由 wait 回收状态。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker></defs><g font-family="sans-serif"><rect x="25" y="45" width="175" height="72" rx="12" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="112" y="76" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">父进程</text><text x="112" y="98" text-anchor="middle" font-size="14" fill="#53676d">task + mm</text><path d="M200 81 H270" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="280" y="45" width="175" height="72" rx="12" fill="#f5f1fd" stroke="#7461ba" stroke-width="2"/><text x="367" y="76" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">fork()</text><text x="367" y="98" text-anchor="middle" font-size="14" fill="#53676d">创建子任务 / COW</text><path d="M455 81 H525" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="535" y="45" width="340" height="72" rx="12" fill="#fff4ed" stroke="#d06d4d" stroke-width="2"/><text x="705" y="76" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">子进程</text><text x="705" y="98" text-anchor="middle" font-size="14" fill="#53676d">写私有页 → COW fault</text><path d="M705 117 V165 H550" stroke="#147f80" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="340" y="165" width="210" height="72" rx="12" fill="#edf6f7" stroke="#147f80" stroke-width="2"/><text x="445" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">execve()</text><text x="445" y="218" text-anchor="middle" font-size="14" fill="#53676d">替换映像；PID 不变</text><path d="M340 201 H200 V201 H165" stroke="#147f80" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="25" y="165" width="140" height="72" rx="12" fill="#f5f1fd" stroke="#7461ba" stroke-width="2"/><text x="95" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">exit()</text><text x="95" y="218" text-anchor="middle" font-size="14" fill="#53676d">退出状态</text><text x="450" y="266" text-anchor="middle" font-size="13" fill="#53676d">父进程通过 wait()/waitpid() 获取退出状态并完成回收</text></g></svg>