<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc"><title id="title">GDB 通过 QEMU gdbstub 调试 Guest 内核</title><desc id="desc">宿主机上的 GDB 使用 vmlinux 中的符号信息，通过 127.0.0.1 的 TCP 端口连接 QEMU gdbstub，控制 Guest CPU 并观察虚拟内存和寄存器。</desc><g font-family="sans-serif"><rect x="16" y="18" width="768" height="264" rx="14" fill="#fffdf9" stroke="#dce5e1" stroke-width="2"/><text x="38" y="47" font-size="15" font-weight="700" fill="#53676d">宿主机 Host</text><rect x="40" y="72" width="210" height="88" rx="10" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="145" y="103" text-anchor="middle" font-size="19" font-weight="700" fill="#203035">GDB</text><text x="145" y="129" text-anchor="middle" font-size="14" fill="#53676d">读取 vmlinux 符号</text><rect x="40" y="182" width="210" height="65" rx="10" fill="#edf1f4" stroke="#53676d" stroke-width="2"/><text x="145" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#203035">源码与调试信息</text><text x="145" y="232" text-anchor="middle" font-size="13" fill="#53676d">同一次内核构建</text><path d="M250 116H350m-11-8 11 8-11 8" fill="none" stroke="#d06d4d" stroke-width="3"/><text x="300" y="100" text-anchor="middle" font-size="12" fill="#53676d">TCP loopback</text><text x="300" y="138" text-anchor="middle" font-size="12" fill="#53676d">127.0.0.1:1234</text><rect x="354" y="72" width="174" height="88" rx="10" fill="#f2eefa" stroke="#7461ba" stroke-width="2"/><text x="441" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">QEMU</text><text x="441" y="130" text-anchor="middle" font-size="14" fill="#53676d">GDB stub</text><path d="M529 116H574m-11-8 11 8-11 8" fill="none" stroke="#147f80" stroke-width="3"/><rect x="578" y="72" width="174" height="88" rx="10" fill="#fff4ed" stroke="#d06d4d" stroke-width="2"/><text x="665" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">Guest CPU</text><text x="665" y="130" text-anchor="middle" font-size="14" fill="#53676d">寄存器 / 内存</text><rect x="354" y="182" width="398" height="65" rx="10" fill="#edf1f4" stroke="#53676d" stroke-width="2"/><text x="553" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">Guest Linux 内核</text><text x="553" y="232" text-anchor="middle" font-size="13" fill="#53676d">bzImage 启动 · vmlinux 符号</text><path d="M665 160V178m-8-9 8 9 8-9" fill="none" stroke="#147f80" stroke-width="2.5"/><text x="400" y="270" text-anchor="middle" font-size="12" fill="#53676d">-S 暂停 Guest；-gdb 指定调试端点；只在隔离实验环境关闭 KASLR</text></g></svg>