<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="t d"><title id="t">EEVDF 调度选择流程</title><desc id="d">任务根据虚拟运行时间与公平份额计算 lag，lag 非负的任务 eligible；调度器比较 eligible 任务的 virtual deadline，选择最早者。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker></defs><g font-family="sans-serif"><rect x="20" y="75" width="185" height="100" rx="12" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="112" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#203035">Runnable tasks</text><text x="112" y="135" text-anchor="middle" font-size="14" fill="#53676d">vruntime / weight</text><text x="112" y="155" text-anchor="middle" font-size="13" fill="#53676d">estimate lag</text><path d="M205 125 H270" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="280" y="75" width="170" height="100" rx="12" fill="#fff4ed" stroke="#d06d4d" stroke-width="2"/><text x="365" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#203035">Eligible?</text><text x="365" y="137" text-anchor="middle" font-size="15" fill="#53676d">lag ≥ 0</text><text x="365" y="157" text-anchor="middle" font-size="13" fill="#53676d">fair share is owed</text><path d="M450 125 H520" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="530" y="75" width="190" height="100" rx="12" fill="#f5f1fd" stroke="#7461ba" stroke-width="2"/><text x="625" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#203035">Virtual deadline</text><text x="625" y="137" text-anchor="middle" font-size="14" fill="#53676d">slice + virtual time</text><text x="625" y="157" text-anchor="middle" font-size="13" fill="#53676d">earliest eligible wins</text><path d="M720 125 H780" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="790" y="88" width="85" height="74" rx="12" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="832" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#203035">Pick</text><text x="832" y="140" text-anchor="middle" font-size="14" fill="#53676d">next</text><path d="M365 175 V214 H235" stroke="#d06d4d" stroke-width="2.5" fill="none"/><text x="230" y="237" text-anchor="middle" font-size="14" fill="#a34b30">lag &lt; 0：暂不 eligible</text><text x="450" y="270" text-anchor="middle" font-size="12" fill="#53676d">概念流程示意；真实调度还受 CPU 拓扑、迁移、抢占与调度类优先级影响</text></g></svg>