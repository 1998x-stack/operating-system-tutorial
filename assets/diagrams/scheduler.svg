<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 205" role="img" aria-labelledby="t d"><title id="t">可运行任务由调度器选择在 CPU 上执行</title><desc id="d">三项可运行任务进入调度器，调度器根据策略选择一个任务运行在CPU。是概念示意而不是特定Linux算法内部实现。</desc><rect x="15" y="20" width="240" height="165" rx="12" fill="#e7f4f0"/><text x="135" y="47" text-anchor="middle" font-size="19" font-weight="700" font-family="sans-serif" fill="#0d6667">可运行任务</text><g font-size="16" font-family="sans-serif" fill="#203035"><rect x="43" y="61" width="184" height="30" rx="7" fill="#fff"/><text x="135" y="82" text-anchor="middle">任务 A</text><rect x="43" y="99" width="184" height="30" rx="7" fill="#fff"/><text x="135" y="120" text-anchor="middle">任务 B</text><rect x="43" y="137" width="184" height="30" rx="7" fill="#fff"/><text x="135" y="158" text-anchor="middle">任务 C</text></g><path d="M266 103H337" stroke="#147f80" stroke-width="3"/><path d="m326 95 12 8-12 8" fill="none" stroke="#147f80" stroke-width="3"/><rect x="350" y="67" width="170" height="73" rx="11" fill="#f2eefa" stroke="#7461ba" stroke-width="2"/><text x="435" y="98" text-anchor="middle" font-size="18" font-family="sans-serif" font-weight="700" fill="#203035">调度器</text><text x="435" y="121" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#53676d">选择下一任务</text><path d="M530 103H606" stroke="#d06d4d" stroke-width="3"/><path d="m594 95 12 8-12 8" fill="none" stroke="#d06d4d" stroke-width="3"/><rect x="620" y="67" width="164" height="73" rx="11" fill="#fff7ea" stroke="#916c22" stroke-width="2"/><text x="702" y="111" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#203035">CPU 运行</text></svg>