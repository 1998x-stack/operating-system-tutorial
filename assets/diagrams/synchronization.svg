<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="t d"><title id="t">同步原语与 RCU 宽限期</title><desc id="d">mutex 竞争时可睡眠，spinlock 竞争时忙等，semaphore 管理计数许可；RCU 读者进入临界区，更新者移除旧指针，宽限期后才回收旧对象。</desc><g font-family="sans-serif" text-anchor="middle"><rect x="25" y="30" width="190" height="78" rx="12" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="120" y="61" font-size="20" font-weight="700" fill="#203035">mutex</text><text x="120" y="87" font-size="14" fill="#53676d">竞争可睡眠</text><rect x="245" y="30" width="190" height="78" rx="12" fill="#fff4ed" stroke="#d06d4d" stroke-width="2"/><text x="340" y="61" font-size="20" font-weight="700" fill="#203035">spinlock</text><text x="340" y="87" font-size="14" fill="#53676d">竞争时忙等</text><rect x="465" y="30" width="190" height="78" rx="12" fill="#f5f1fd" stroke="#7461ba" stroke-width="2"/><text x="560" y="61" font-size="20" font-weight="700" fill="#203035">semaphore</text><text x="560" y="87" font-size="14" fill="#53676d">计数许可</text><rect x="685" y="30" width="190" height="78" rx="12" fill="#edf6f7" stroke="#147f80" stroke-width="2"/><text x="780" y="61" font-size="20" font-weight="700" fill="#203035">RCU</text><text x="780" y="87" font-size="14" fill="#53676d">读侧协议</text><path d="M780 108 V150 H125" stroke="#147f80" stroke-width="2.5" fill="none"/><rect x="35" y="165" width="180" height="62" rx="10" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="125" y="190" font-size="15" font-weight="700" fill="#203035">读侧临界区</text><text x="125" y="212" font-size="12" fill="#53676d">read_lock / unlock</text><path d="M215 196 H300" stroke="#147f80" stroke-width="2.5"/><rect x="310" y="165" width="180" height="62" rx="10" fill="#fff4ed" stroke="#d06d4d" stroke-width="2"/><text x="400" y="190" font-size="15" font-weight="700" fill="#203035">更新者发布</text><text x="400" y="212" font-size="12" fill="#53676d">移除旧指针</text><path d="M490 196 H575" stroke="#147f80" stroke-width="2.5"/><rect x="585" y="165" width="135" height="62" rx="10" fill="#f5f1fd" stroke="#7461ba" stroke-width="2"/><text x="652" y="190" font-size="15" font-weight="700" fill="#203035">宽限期</text><text x="652" y="212" font-size="12" fill="#53676d">等待旧读者</text><path d="M720 196 H775" stroke="#147f80" stroke-width="2.5"/><rect x="785" y="165" width="90" height="62" rx="10" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="830" y="190" font-size="15" font-weight="700" fill="#203035">回收</text><text x="830" y="212" font-size="12" fill="#53676d">free</text><text x="450" y="264" font-size="12" fill="#53676d">选择原语前先确认上下文、持锁时能否睡眠、所有者与生命周期规则</text></g></svg>