<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="t d"><title id="t">三种线程模型：用户态线程到内核可调度实体的映射</title><desc id="d">M:1 多个用户态线程映射到一个内核线程；1:1 每个用户态线程对应一个内核线程；M:N 多个用户态线程复用较少的若干内核线程。图中方框表示执行流，箭头只表示映射关系，不表示具体实现或调度时序。</desc><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#53676d"/></marker></defs><g font-family="sans-serif"><text x="400" y="26" text-anchor="middle" font-size="17" fill="#203035">用户态线程如何映射到内核可调度实体</text><text x="26" y="70" font-size="14" fill="#147f80">用户线程</text><text x="148" y="70" font-size="14" fill="#7461ba">内核线程</text><g fill="#e7f4f0" stroke="#147f80" stroke-width="2"><rect x="26" y="78" width="78" height="26" rx="6"/><rect x="26" y="116" width="78" height="26" rx="6"/><rect x="26" y="154" width="78" height="26" rx="6"/><rect x="291" y="78" width="78" height="26" rx="6"/><rect x="291" y="116" width="78" height="26" rx="6"/><rect x="291" y="154" width="78" height="26" rx="6"/><rect x="556" y="78" width="78" height="26" rx="6"/><rect x="556" y="116" width="78" height="26" rx="6"/><rect x="556" y="154" width="78" height="26" rx="6"/></g><g fill="#f2eefa" stroke="#7461ba" stroke-width="2"><rect x="148" y="116" width="78" height="26" rx="6"/><rect x="413" y="78" width="78" height="26" rx="6"/><rect x="413" y="116" width="78" height="26" rx="6"/><rect x="413" y="154" width="78" height="26" rx="6"/><rect x="678" y="98" width="78" height="26" rx="6"/><rect x="678" y="136" width="78" height="26" rx="6"/></g><g stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#ah)"><path d="M106 91L144 129"/><path d="M106 167L144 129"/><path d="M371 91L409 91"/><path d="M371 129L409 129"/><path d="M371 167L409 167"/><path d="M636 91L674 111"/><path d="M636 129L674 149"/><path d="M636 167L674 149"/></g><text x="115" y="205" text-anchor="middle" font-size="15" fill="#203035">M:1 用户级</text><text x="115" y="226" text-anchor="middle" font-size="12" fill="#53676d">一个阻塞即阻塞整个进程</text><text x="380" y="205" text-anchor="middle" font-size="15" fill="#203035">1:1 内核级（pthread）</text><text x="380" y="226" text-anchor="middle" font-size="12" fill="#53676d">内核独立调度，利用多核</text><text x="682" y="205" text-anchor="middle" font-size="15" fill="#203035">M:N 混合（Go）</text><text x="682" y="226" text-anchor="middle" font-size="12" fill="#53676d">运行时复用较少内核线程</text><text x="26" y="286" font-size="12" fill="#53676d">说明：M:1 中内核只看到一个可调度实体；M:N 的挂起/恢复由用户态运行时协调，</text><text x="26" y="304" font-size="12" fill="#53676d">实际行为取决于运行时与阻塞路径，本图不代表某个具体实现。</text></g></svg>
