<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d">
<title id="t">一次文件读取在应用、VFS、页缓存与块设备之间的分层</title>
<desc id="d">应用通过文件描述符发起的读写请求，先经过 VFS：把路径分量逐个解析为 dentry，再由 dentry 指向 inode。inode 通过 address_space 与页缓存关联，命中页缓存即无需访问设备；未命中时由具体文件系统（如 ext4、Btrfs）向块设备提交 I/O。图只表示分层与典型数据流，不代表某一内核版本的函数调用链。</desc>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#53676d"/></marker></defs>
<g font-family="sans-serif">
<text x="400" y="26" text-anchor="middle" font-size="17" fill="#203035">一次 read() 经过的分层</text>
<rect x="60" y="44" width="680" height="34" rx="8" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/>
<text x="400" y="66" text-anchor="middle" font-size="13" fill="#203035">应用：open(path) → fd 3 → struct file（读写偏移、打开模式）</text>
<path d="M400 78 L400 98" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect x="60" y="100" width="680" height="44" rx="8" fill="#f2eefa" stroke="#7461ba" stroke-width="2"/>
<text x="400" y="120" text-anchor="middle" font-size="13" fill="#203035">VFS：路径分量逐个解析 → dentry（dcache）→ d_inode 指向 inode #12345</text>
<text x="400" y="137" text-anchor="middle" font-size="12" fill="#53676d">文件名存在 dentry 中；inode 保存权限、大小、数据块指针等元数据</text>
<path d="M400 144 L400 164" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect x="60" y="166" width="680" height="40" rx="8" fill="#fbe9e1" stroke="#d06d4d" stroke-width="2"/>
<text x="400" y="191" text-anchor="middle" font-size="13" fill="#203035">page cache：inode → address_space → 缓存 folio（命中则不访问设备）</text>
<path d="M400 206 L400 224" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect x="60" y="226" width="680" height="40" rx="8" fill="#f6efdc" stroke="#916c22" stroke-width="2"/>
<text x="400" y="251" text-anchor="middle" font-size="13" fill="#203035">文件系统（ext4 / Btrfs）→ submit_bio → 块设备驱动</text>
<text x="60" y="288" font-size="12" fill="#53676d">简化示意图：只表达对象之间的引用与数据流方向，不代表具体函数名、缓存淘汰策略或某一内核版本实现。</text>
</g></svg>
