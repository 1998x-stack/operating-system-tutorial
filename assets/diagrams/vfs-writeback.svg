<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="t d"><title id="t">VFS 路径解析、页缓存写回与持久化</title><desc id="d">open 解析路径并关联 dentry、inode 与 struct file；write 修改页缓存并标记 dirty；writeback 将数据提交到底层，fsync 请求同步文件数据与元数据。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><rect x="20" y="40" width="155" height="72" rx="12" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="97" y="69" font-size="18" font-weight="700" fill="#203035">open(path)</text><text x="97" y="92" font-size="13" fill="#53676d">pathname lookup</text><path d="M175 76 H230" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="240" y="40" width="180" height="72" rx="12" fill="#f5f1fd" stroke="#7461ba" stroke-width="2"/><text x="330" y="69" font-size="18" font-weight="700" fill="#203035">dentry / inode</text><text x="330" y="92" font-size="13" fill="#53676d">path + metadata</text><path d="M420 76 H475" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="485" y="40" width="165" height="72" rx="12" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="567" y="69" font-size="18" font-weight="700" fill="#203035">struct file</text><text x="567" y="92" font-size="13" fill="#53676d">open file description</text><path d="M567 112 V155" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="460" y="165" width="215" height="72" rx="12" fill="#fff4ed" stroke="#d06d4d" stroke-width="2"/><text x="567" y="194" font-size="18" font-weight="700" fill="#203035">page cache</text><text x="567" y="217" font-size="13" fill="#53676d">write → dirty folio</text><path d="M675 201 H730" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="740" y="165" width="135" height="72" rx="12" fill="#f5f1fd" stroke="#7461ba" stroke-width="2"/><text x="807" y="194" font-size="17" font-weight="700" fill="#203035">writeback</text><text x="807" y="217" font-size="13" fill="#53676d">block device</text><text x="450" y="266" font-size="12" fill="#53676d">write() 成功 ≠ 持久化完成；fsync()/fdatasync() 请求同步，rename 后还可能需要 fsync 目录</text></g></svg>