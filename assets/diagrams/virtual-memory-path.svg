<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="t d"><title id="t">虚拟地址翻译与缺页处理</title><desc id="d">CPU 发出虚拟地址，先查 TLB；命中后得到物理地址，未命中则进行页表遍历；有效映射可继续，映射缺失或权限错误会触发 page fault。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker></defs><g font-family="sans-serif"><rect x="20" y="90" width="135" height="72" rx="12" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="87" y="120" text-anchor="middle" font-size="19" font-weight="700" fill="#203035">VA</text><text x="87" y="143" text-anchor="middle" font-size="13" fill="#53676d">CPU access</text><path d="M155 126 H220" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="230" y="90" width="135" height="72" rx="12" fill="#f5f1fd" stroke="#7461ba" stroke-width="2"/><text x="297" y="120" text-anchor="middle" font-size="19" font-weight="700" fill="#203035">TLB</text><text x="297" y="143" text-anchor="middle" font-size="13" fill="#53676d">translation cache</text><path d="M365 126 H425" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="435" y="35" width="185" height="72" rx="12" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="527" y="65" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">TLB hit</text><text x="527" y="88" text-anchor="middle" font-size="13" fill="#53676d">PA + access</text><path d="M365 126 V205 H425" stroke="#d06d4d" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="435" y="170" width="185" height="72" rx="12" fill="#fff4ed" stroke="#d06d4d" stroke-width="2"/><text x="527" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">TLB miss</text><text x="527" y="223" text-anchor="middle" font-size="13" fill="#53676d">page-table walk</text><path d="M620 206 H680" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/><rect x="690" y="35" width="185" height="72" rx="12" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="782" y="65" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">valid mapping</text><text x="782" y="88" text-anchor="middle" font-size="13" fill="#53676d">fill TLB / continue</text><rect x="690" y="170" width="185" height="72" rx="12" fill="#f5f1fd" stroke="#7461ba" stroke-width="2"/><text x="782" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">page fault</text><text x="782" y="223" text-anchor="middle" font-size="13" fill="#53676d">resolve or signal</text><path d="M620 206 H680" stroke="#d06d4d" stroke-width="2.5" fill="none"/><text x="450" y="267" text-anchor="middle" font-size="12" fill="#53676d">TLB miss 不必然是 page fault；缺页异常也可能是合法的 demand paging 或 COW</text></g></svg>