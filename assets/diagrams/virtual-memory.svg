<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 275" role="img" aria-labelledby="t d"><title id="t">虚拟地址到物理地址的翻译路径</title><desc id="d">CPU发出虚拟地址；优先查找TLB，未命中时查询页表；有效映射最终定位物理内存，映射缺失则可能触发缺页异常。是概念图。</desc><g font-family="sans-serif"><rect x="14" y="97" width="156" height="63" rx="9" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="92" y="125" text-anchor="middle" font-size="18" fill="#203035">CPU</text><text x="92" y="147" text-anchor="middle" font-size="13" fill="#53676d">虚拟地址</text><rect x="235" y="97" width="149" height="63" rx="9" fill="#f2eefa" stroke="#7461ba" stroke-width="2"/><text x="309" y="135" text-anchor="middle" font-size="18" fill="#203035">TLB</text><rect x="450" y="97" width="149" height="63" rx="9" fill="#f2eefa" stroke="#7461ba" stroke-width="2"/><text x="525" y="135" text-anchor="middle" font-size="18" fill="#203035">页表遍历</text><rect x="645" y="97" width="140" height="63" rx="9" fill="#e7f4f0" stroke="#147f80" stroke-width="2"/><text x="715" y="126" text-anchor="middle" font-size="17" fill="#203035">物理内存</text><text x="715" y="147" text-anchor="middle" font-size="13" fill="#53676d">有效映射</text><g stroke="#147f80" stroke-width="3" fill="none"><path d="M173 129H230"/><path d="m220 121 11 8-11 8"/><path d="M385 129H445"/><path d="m435 121 11 8-11 8"/><path d="M600 129H640"/><path d="m630 121 11 8-11 8"/><path d="M310 93V40H715V93"/><path d="m706 83 9 11 9-11"/></g><g font-size="13" fill="#53676d"><text x="420" y="118" text-anchor="middle">未命中</text><text x="500" y="31" text-anchor="middle">命中时直接使用映射</text></g><path d="M525 164V205" stroke="#d06d4d" stroke-width="3"/><path d="m516 194 9 12 9-12" stroke="#d06d4d" fill="none" stroke-width="3"/><rect x="445" y="212" width="160" height="45" rx="9" fill="#fff4ed" stroke="#d06d4d" stroke-width="2"/><text x="525" y="241" font-size="15" text-anchor="middle" fill="#203035">缺页异常路径</text><text x="607" y="197" font-size="13" fill="#53676d">映射缺失时</text></g></svg>